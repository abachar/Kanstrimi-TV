<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#07080B;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(255,255,255,0.10);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),0 18px 50px rgba(0,0,0,0.35)}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:6px;border:1.5px solid rgba(255,255,255,0.6);font-size:15px;font-weight:700;letter-spacing:0.04em;color:#F5F5F7;box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07080B;">
  <div style="position: absolute; inset: 0; background: radial-gradient(60% 75% at 72% 30%, #D9985A 0%, #8A4B2A 24%, #2B1A1C 54%, #07080B 82%);"></div>
  <div style="position: absolute; left: 1200px; top: 110px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,150,0.55), rgba(255,214,150,0) 70%);"></div>
  <div style="position: absolute; right: 96px; top: 150px; font-size: 16px; letter-spacing: 0.12em; color: rgba(255,255,255,0.45);">[VISUEL CLÉ DU FILM]</div>
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,8,11,0.88) 0%, rgba(7,8,11,0) 58%);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(180deg, rgba(7,8,11,0) 0%, rgba(7,8,11,0.88) 42%, #07080B 100%);"></div>

  <nav class="glass" aria-label="Onglets" style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 40px;">
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: rgba(255,255,255,0.24); color: #F5F5F7; font-size: 24px; font-weight: 700;">Accueil</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Direct</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Films</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Séries</button>
    <button aria-label="Rechercher" style="border: none; width: 56px; height: 52px; border-radius: 28px; background: transparent; color: rgba(245,245,247,0.78); display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    </button>
  </nav>
  <button class="glass" aria-label="Réglages" style="position: absolute; right: 96px; top: 50px; width: 60px; height: 60px; border-radius: 30px; color: #F5F5F7; display: flex; align-items: center; justify-content: center;">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
  </button>

  <div style="position: absolute; left: 96px; top: 250px; width: 980px; display: flex; flex-direction: column; gap: 18px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: #F5B544;">FILM · NOUVEAUTÉ</div>
    <h1 style="margin: 0; font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -0.02em;">Les Heures Claires</h1>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 24px; color: rgba(235,235,245,0.75);">
      <span>2025 · Drame · 2 h 07</span>
      <span class="badge">12+</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #F5B544; stroke-width: 1.8; stroke-linejoin: round;"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
      <span style="font-size: 24px; font-weight: 600;">4K Dolby Vision · VF</span>
      <span style="font-size: 22px; color: rgba(235,235,245,0.62);">— choisi pour vous</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; margin-top: 18px;">
      <button style="display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 44px; border: none; border-radius: 38px; background: #F5F5F7; color: #0B0B0F; font-size: 28px; font-weight: 700; transform: scale(1.06); box-shadow: 0 22px 50px rgba(0,0,0,0.5);">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor;"><path d="M7 4.5v15l12-7.5z"></path></svg>
        Lecture
      </button>
      <button class="glass" style="height: 76px; padding: 0 34px; border-radius: 38px; color: #F5F5F7; font-size: 26px; font-weight: 600;">Versions · 7</button>
      <button class="glass" aria-label="Ajouter à ma liste" style="width: 76px; height: 76px; border-radius: 38px; color: #F5F5F7; display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <div style="position: absolute; left: 96px; top: 700px; right: 0; display: flex; flex-direction: column; gap: 22px;">
    <h2 style="margin: 0; font-size: 30px; font-weight: 700;">Reprendre</h2>
    <div style="display: flex; gap: 40px;">
      <sc-for list="{{resume}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 10px; width: 400px; flex-shrink: 0;">
          <div style="position: relative; width: 400px; height: 225px; border-radius: 18px; overflow: hidden; background: {{c.art}};">
            <div class="glass" style="position: absolute; left: 14px; top: 14px; padding: 6px 12px; border-radius: 12px; font-size: 16px; font-weight: 700; letter-spacing: 0.02em;">{{c.version}}</div>
            <div style="position: absolute; left: 18px; right: 18px; bottom: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.3);">
              <div style="width: {{c.progress}}; height: 6px; border-radius: 3px; background: #F5F5F7;"></div>
            </div>
          </div>
          <div style="font-size: 24px; font-weight: 600;">{{c.title}}</div>
          <div style="font-size: 19px; color: rgba(235,235,245,0.62);">{{c.meta}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      resume: [
        { title: 'Nord Profond', meta: 'S2 · É4 · 32 min restantes', version: 'VOSTFR · 4K', progress: '45%', art: 'radial-gradient(80% 90% at 70% 30%, #4E7FA0 0%, #1B3346 55%, #0B141C 100%)' },
        { title: 'Marée Basse', meta: 'Film · 48 min restantes', version: 'VF · 4K DOLBY VISION', progress: '62%', art: 'radial-gradient(80% 90% at 30% 40%, #7FA38A 0%, #2A3F33 55%, #0D1511 100%)' },
        { title: 'Atlas Sauvage', meta: 'Doc · É2 · 21 min restantes', version: 'VF · HD', progress: '20%', art: 'radial-gradient(80% 90% at 60% 60%, #B7834A 0%, #4A3120 55%, #140D08 100%)' },
        { title: 'Minuit à Oran', meta: 'Film · 18 min restantes', version: 'VO · 4K HDR', progress: '84%', art: 'radial-gradient(80% 90% at 50% 20%, #9C5D8F 0%, #3A2138 55%, #120A11 100%)' },
        { title: 'Ligne de Crête', meta: 'S1 · É7 · 40 min restantes', version: 'VF · 4K', progress: '12%', art: 'radial-gradient(80% 90% at 40% 30%, #6F79B8 0%, #262B4D 55%, #0B0C18 100%)' }
      ]
    };
  }
}
</script>
</body>
</html>
