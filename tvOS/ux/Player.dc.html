<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lecteur — versions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#07080B;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(30,30,34,0.42);backdrop-filter:blur(44px) saturate(170%);-webkit-backdrop-filter:blur(44px) saturate(170%);border:1px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),0 18px 50px rgba(0,0,0,0.35)}
button{font-family:inherit;cursor:pointer;text-align:left}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07080B;">
  <div style="position: absolute; inset: 0; background: radial-gradient(70% 80% at 60% 35%, #E0A565 0%, #9A5A31 26%, #3A2220 58%, #0E0A0B 90%);"></div>
  <div style="position: absolute; left: 50%; top: 220px; transform: translateX(-50%); font-size: 16px; letter-spacing: 0.12em; color: rgba(255,255,255,0.5);">[IMAGE DU FILM EN LECTURE]</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);"></div>

  <section class="glass" aria-label="Panneau de lecture" style="position: absolute; left: 80px; top: 470px; width: 1760px; box-sizing: border-box; padding: 26px 32px 32px; border-radius: 38px; display: flex; flex-direction: column; gap: 24px;">
    <div role="tablist" aria-label="Sections" style="display: flex; gap: 6px;">
      <button role="tab" aria-selected="false" style="border: none; height: 48px; padding: 0 22px; border-radius: 24px; background: transparent; color: rgba(245,245,247,0.72); font-size: 21px; font-weight: 600;">Infos</button>
      <button role="tab" aria-selected="true" style="border: none; height: 48px; padding: 0 22px; border-radius: 24px; background: rgba(255,255,255,0.22); color: #F5F5F7; font-size: 21px; font-weight: 700;">Versions</button>
      <button role="tab" aria-selected="false" style="border: none; height: 48px; padding: 0 22px; border-radius: 24px; background: transparent; color: rgba(245,245,247,0.72); font-size: 21px; font-weight: 600;">Audio</button>
      <button role="tab" aria-selected="false" style="border: none; height: 48px; padding: 0 22px; border-radius: 24px; background: transparent; color: rgba(245,245,247,0.72); font-size: 21px; font-weight: 600;">Sous-titres</button>
      <div style="flex-grow: 1;"></div>
      <span style="align-self: center; font-size: 19px; color: rgba(235,235,245,0.66);">Reprise au même instant · 1:12:48</span>
    </div>
    <div style="display: flex; gap: 28px;">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
        <button style="position: relative; display: flex; flex-direction: column; gap: 8px; width: 392px; height: 184px; box-sizing: border-box; padding: 24px 26px; border: {{c.border}}; border-radius: 26px; background: {{c.bg}}; color: {{c.fg}}; transform: {{c.scale}}; box-shadow: {{c.shadow}};">
          <span style="font-size: 26px; font-weight: 800;">{{c.q}}</span>
          <span style="font-size: 20px; font-weight: 600;">{{c.lang}}</span>
          <span style="font-size: 18px; color: {{c.muted}};">{{c.audio}}</span>
          <span style="position: absolute; left: 26px; bottom: 20px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; letter-spacing: 0.03em; color: {{c.tagColor}};">
            <sc-if value="{{c.current}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
            {{c.tag}}
          </span>
        </button>
      </sc-for>
    </div>
  </section>

  <div style="position: absolute; left: 80px; right: 80px; top: 900px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 16px;">
      <span style="font-size: 30px; font-weight: 800;">Les Heures Claires</span>
      <span style="font-size: 20px; color: rgba(235,235,245,0.7);">4K Dolby Vision · VF</span>
    </div>
    <div style="position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.28);">
      <div style="width: 57%; height: 10px; border-radius: 5px; background: #F5F5F7;"></div>
      <div style="position: absolute; left: 57%; top: -7px; width: 4px; height: 24px; border-radius: 2px; background: #F5F5F7; margin-left: -2px;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; color: rgba(245,245,247,0.85);">
      <span>1:12:48</span><span>−54:12</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { border: '1px solid rgba(255,255,255,0.14)', bg: 'rgba(255,255,255,0.08)', fg: '#F5F5F7', muted: 'rgba(235,235,245,0.66)', scale: 'none', shadow: 'none', tagColor: 'rgba(235,235,245,0.66)', current: false };
    return {
      cards: [
        { ...base, q: '4K · Dolby Vision', lang: 'Français', audio: 'MKV', tag: 'EN COURS', current: true, tagColor: '#F5B544', border: '2px solid #F5B544' },
        { ...base, q: '4K · HDR', lang: 'Français', audio: 'MKV · 2 sources', tag: 'Source A' },
        { ...base, q: '4K · Dolby Vision', lang: 'VOSTFR', audio: 'Anglais · sous-titres FR', tag: 'Reprise au même instant', bg: 'rgba(245,245,247,0.95)', fg: '#0B0B0F', muted: 'rgba(11,11,15,0.66)', tagColor: '#0B0B0F', scale: 'scale(1.05)', shadow: '0 22px 50px rgba(0,0,0,0.5)', border: 'none' },
        { ...base, q: 'HD · 1080p', lang: 'Français', audio: 'MP4', tag: '1 source' }
      ]
    };
  }
}
</script>
</body>
</html>
