<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Préférences de lecture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#101014;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid rgba(255,255,255,0.14);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18)}
button{font-family:inherit;cursor:pointer;text-align:left}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(70% 90% at 25% 45%, #26222E 0%, #131218 60%, #0C0C10 100%);">
  <div style="position: absolute; left: 0; top: 0; width: 900px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;">
    <div class="glass" style="width: 300px; height: 300px; border-radius: 150px; display: flex; align-items: center; justify-content: center;">
      <svg width="150" height="150" viewBox="0 0 64 64" aria-hidden="true" style="fill: none; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M32 10L12 46h40z" style="stroke: #F5F5F7; stroke-width: 2.6;"></path>
        <path d="M4 30h18" style="stroke: #F5F5F7; stroke-width: 2.6;"></path>
        <path d="M40 30l20-8" style="stroke: #F5B544; stroke-width: 2.6;"></path>
        <path d="M41 33l19 1" style="stroke: #8EC5F0; stroke-width: 2.6;"></path>
        <path d="M40 36l20 10" style="stroke: #30D158; stroke-width: 2.6;"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-size: 48px; font-weight: 800;">Préférences de lecture</h1>
      <span style="font-size: 23px; color: rgba(235,235,245,0.66);">Apple TV « Salon »</span>
    </div>
  </div>

  <div style="position: absolute; left: 920px; top: 150px; width: 900px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button style="display: flex; align-items: center; gap: 20px; width: 100%; height: 88px; box-sizing: border-box; padding: 0 30px; border: none; border-radius: 22px; background: {{r.bg}}; color: {{r.fg}}; transform: {{r.scale}}; box-shadow: {{r.shadow}};">
        <span style="font-size: 25px; font-weight: 600; flex-grow: 1;">{{r.label}}</span>
        <span style="font-size: 23px; color: {{r.muted}};">{{r.value}}</span>
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55;"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </sc-for>
    <p style="margin: 18px 30px 0; font-size: 20px; line-height: 1.45; color: rgba(235,235,245,0.6);">Ordre utilisé par Lecture pour choisir la version. Un choix fait dans le sélecteur de versions est mémorisé pour le titre et prime sur ces réglages.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { bg: 'rgba(255,255,255,0.07)', fg: '#F5F5F7', muted: 'rgba(235,235,245,0.62)', scale: 'none', shadow: 'none' };
    const on = { bg: 'rgba(245,245,247,0.95)', fg: '#0B0B0F', muted: 'rgba(11,11,15,0.62)', scale: 'scale(1.03)', shadow: '0 20px 44px rgba(0,0,0,0.5)' };
    return {
      rows: [
        { ...off, label: 'Langue audio', value: 'VF › VOSTFR › VO' },
        { ...off, label: 'Sous-titres', value: 'Si la langue n’est pas comprise' },
        { ...off, label: 'Qualité maximale', value: 'Auto · 4K Dolby Vision' },
        { ...on, label: 'Choix de la version', value: 'Automatique' },
        { ...off, label: 'Mémoriser par film ou série', value: 'Activé' },
        { ...off, label: 'Changer de source en cas de panne', value: 'Activé' }
      ]
    };
  }
}
</script>
</body>
</html>
