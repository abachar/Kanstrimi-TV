<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#101014;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid rgba(255,255,255,0.14);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18)}
.sec{margin:0;font-size:18px;font-weight:700;letter-spacing:0.1em;color:rgba(235,235,245,0.55);padding:0 30px}
button{font-family:inherit;cursor:pointer;text-align:left}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(70% 90% at 25% 45%, #26222E 0%, #131218 60%, #0C0C10 100%);">
  <div style="position: absolute; left: 0; top: 0; width: 820px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;">
    <div class="glass" style="width: 260px; height: 260px; border-radius: 130px; display: flex; align-items: center; justify-content: center;">
      <svg width="120" height="120" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #F5F5F7; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round;"><rect x="2.5" y="5" width="19" height="12" rx="2"></rect><path d="M8 20h8"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <h1 style="margin: 0; font-size: 48px; font-weight: 800;">Réglages</h1>
      <span style="font-size: 23px; color: rgba(235,235,245,0.66);">Apple TV « Salon »</span>
    </div>
  </div>

  <div style="position: absolute; left: 840px; top: 70px; width: 980px; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 class="sec">LECTURE</h2>
      <sc-for list="{{play}}" as="r" hint-placeholder-count="5">
        <button style="display: flex; align-items: center; gap: 20px; width: 100%; height: 74px; box-sizing: border-box; padding: 0 30px; border: none; border-radius: 20px; background: {{r.bg}}; color: {{r.fg}}; transform: {{r.scale}}; box-shadow: {{r.shadow}};">
          <span style="font-size: 23px; font-weight: 600; flex-grow: 1;">{{r.label}}</span>
          <span style="font-size: 21px; color: {{r.muted}};">{{r.value}}</span>
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55;"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 class="sec">APPAREIL</h2>
      <sc-for list="{{device}}" as="r" hint-placeholder-count="3">
        <button style="display: flex; align-items: center; gap: 20px; width: 100%; height: 74px; box-sizing: border-box; padding: 0 30px; border: none; border-radius: 20px; background: {{r.bg}}; color: {{r.fg}};">
          <span style="font-size: 23px; font-weight: 600; flex-grow: 1;">{{r.label}}</span>
          <span style="font-size: 21px; color: {{r.muted}};">{{r.value}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 class="sec">À PROPOS</h2>
      <div class="glass" style="display: flex; flex-direction: column; gap: 12px; padding: 22px 30px; border-radius: 20px; font-size: 20px; color: rgba(235,235,245,0.8);">
        <div style="display: flex; justify-content: space-between;"><span>Application</span><span style="color: rgba(235,235,245,0.6);">1.0 (12)</span></div>
        <div style="display: flex; justify-content: space-between;"><span>Serveur</span><span style="color: rgba(235,235,245,0.6);">kanstrimi.crafters.dev · 0.9.3</span></div>
        <div style="display: flex; justify-content: space-between;"><span>Catalogue</span><span style="color: rgba(235,235,245,0.6);">35 219 films · 22 174 séries · 722 chaînes</span></div>
        <div style="display: flex; justify-content: space-between;"><span>Dernier import</span><span style="color: rgba(235,235,245,0.6);">Aujourd'hui, 04:10 · TMDB à 97 %</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const off = { bg: 'rgba(255,255,255,0.07)', fg: '#F5F5F7', muted: 'rgba(235,235,245,0.62)', scale: 'none', shadow: 'none' };
    const on = { bg: 'rgba(245,245,247,0.95)', fg: '#0B0B0F', muted: 'rgba(11,11,15,0.62)', scale: 'scale(1.03)', shadow: '0 20px 44px rgba(0,0,0,0.5)' };
    return {
      play: [
        { ...off, label: 'Langue audio', value: 'VF › VOSTFR › VO' },
        { ...off, label: 'Qualité maximale', value: '4K' },
        { ...on, label: 'Épisode suivant automatique', value: 'Activé · 10 s' },
        { ...off, label: 'Mémoriser la version par titre', value: 'Activé' },
        { ...off, label: 'Changer de source en cas de panne', value: 'Activé' }
      ],
      device: [
        { ...off, label: 'Nom de cet Apple TV', value: 'Salon' },
        { ...off, label: 'Serveur', value: 'https://kanstrimi.crafters.dev' },
        { ...off, bg: 'rgba(255,69,58,0.12)', fg: '#FF6961', label: 'Dissocier cet Apple TV', value: 'Révoque le jeton, retour au QR code' }
      ]
    };
  }
}
</script>
</body>
</html>
