<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil hors ligne</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#07080B;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(255,255,255,0.10);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),0 18px 50px rgba(0,0,0,0.35)}
button{font-family:inherit;cursor:pointer}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07080B;">
  <div style="position: absolute; inset: 0; background: radial-gradient(60% 75% at 72% 30%, #4A3A30 0%, #241A18 40%, #07080B 82%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,8,11,0.88) 0%, rgba(7,8,11,0) 58%);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(180deg, rgba(7,8,11,0) 0%, rgba(7,8,11,0.88) 42%, #07080B 100%);"></div>

  <nav class="glass" aria-label="Onglets" style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 40px;">
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: rgba(255,255,255,0.24); color: #F5F5F7; font-size: 24px; font-weight: 700;">Accueil</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Direct</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Films</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Séries</button>
    <button aria-label="Rechercher" style="border: none; width: 56px; height: 52px; border-radius: 28px; background: transparent; color: rgba(245,245,247,0.78); display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    </button>
  </nav>

  <div class="glass" role="status" style="position: absolute; left: 96px; top: 150px; display: flex; align-items: center; gap: 18px; padding: 14px 18px 14px 20px; border-radius: 22px; border-color: rgba(255,159,10,0.5);">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #FF9F0A; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"></path><path d="M12 19h.01"></path><path d="M3 3l18 18"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 21px; font-weight: 700;">Serveur injoignable</span>
      <span style="font-size: 17px; color: rgba(235,235,245,0.7);">Accueil du 25 sept. à 21:14 affiché · la lecture reste possible si le flux répond</span>
    </div>
    <button style="height: 48px; padding: 0 22px; margin-left: 10px; border: none; border-radius: 24px; background: #F5F5F7; color: #0B0B0F; font-size: 19px; font-weight: 700;">Réessayer</button>
  </div>

  <div style="position: absolute; left: 96px; top: 280px; width: 980px; display: flex; flex-direction: column; gap: 18px; opacity: 0.8;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: rgba(235,235,245,0.55);">FILM · NOUVEAUTÉ</div>
    <h1 style="margin: 0; font-size: 96px; line-height: 1; font-weight: 800; letter-spacing: -0.02em;">Les Heures Claires</h1>
    <div style="font-size: 24px; color: rgba(235,235,245,0.75);">2025 · Drame · 2 h 07</div>
    <div style="display: flex; align-items: center; gap: 24px; margin-top: 12px;">
      <button style="display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 44px; border: none; border-radius: 38px; background: #F5F5F7; color: #0B0B0F; font-size: 28px; font-weight: 700;">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor;"><path d="M7 4.5v15l12-7.5z"></path></svg>
        Lecture
      </button>
      <span style="font-size: 19px; color: rgba(235,235,245,0.6);">Version connue à 21:14 · elle sera revérifiée au lancement</span>
    </div>
  </div>

  <div style="position: absolute; left: 96px; top: 700px; right: 0; display: flex; flex-direction: column; gap: 22px;">
    <h2 style="margin: 0; font-size: 30px; font-weight: 700;">Reprendre</h2>
    <div style="display: flex; gap: 40px;">
      <sc-for list="{{resume}}" as="c" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 10px; width: 400px; flex-shrink: 0; opacity: 0.85;">
          <div style="position: relative; width: 400px; height: 225px; border-radius: 18px; overflow: hidden; background: {{c.art}};">
            <div style="position: absolute; left: 18px; right: 18px; bottom: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.3);">
              <div style="width: {{c.progress}}; height: 6px; border-radius: 3px; background: #F5F5F7;"></div>
            </div>
          </div>
          <div style="font-size: 24px; font-weight: 600;">{{c.title}}</div>
          <div style="font-size: 19px; color: rgba(235,235,245,0.62);">{{c.meta}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      resume: [
        { title: 'Nord Profond', meta: 'S2 · É4 · 32 min restantes', progress: '45%', art: 'radial-gradient(80% 90% at 70% 30%, #4E7FA0 0%, #1B3346 55%, #0B141C 100%)' },
        { title: 'Marée Basse', meta: 'Film · 48 min restantes', progress: '62%', art: 'radial-gradient(80% 90% at 30% 40%, #7FA38A 0%, #2A3F33 55%, #0D1511 100%)' },
        { title: 'Atlas Sauvage', meta: 'Doc · É2 · 21 min restantes', progress: '20%', art: 'radial-gradient(80% 90% at 60% 60%, #B7834A 0%, #4A3120 55%, #140D08 100%)' },
        { title: 'Minuit à Oran', meta: 'Film · 18 min restantes', progress: '84%', art: 'radial-gradient(80% 90% at 50% 20%, #9C5D8F 0%, #3A2138 55%, #120A11 100%)' }
      ]
    };
  }
}
</script>
</body>
</html>
