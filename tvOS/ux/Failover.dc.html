<style>

.glass{background:rgba(30,30,34,0.45);backdrop-filter:blur(44px) saturate(170%);-webkit-backdrop-filter:blur(44px) saturate(170%);border:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),0 18px 50px rgba(0,0,0,0.35)}

<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(90% 90% at 50% 60%, #3E8A4B 0%, #1F5A2B 45%, #0C2412 100%);">
  <div style="position: absolute; left: 50%; top: 12%; bottom: 12%; width: 3px; background: rgba(255,255,255,0.32);"></div>
  <div style="position: absolute; left: 50%; top: 50%; width: 280px; height: 280px; margin: -140px 0 0 -140px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.32);"></div>
  <div style="position: absolute; left: 50%; top: 50%; transform: translateX(-50%); margin-top: 180px; font-size: 16px; letter-spacing: 0.12em; color: rgba(255,255,255,0.5);">[FLUX VIDÉO EN DIRECT]</div>

  <div class="glass" style="position: absolute; left: 80px; top: 60px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 30px;">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #D70015; color: #FFFFFF; font-size: 15px; font-weight: 800; letter-spacing: 0.06em;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFFFFF;"></span>EN DIRECT</span>
    <span style="font-size: 22px; font-weight: 700;">Arena 1</span>
    <span style="font-size: 20px; color: rgba(235,235,245,0.75);">Lyon – Nantes</span>
  </div>

  <div class="glass" role="status" style="position: absolute; right: 80px; top: 60px; width: 640px; box-sizing: border-box; padding: 24px 26px 20px; border-radius: 30px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: rgba(48,209,88,0.2); color: #30D158; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 24px; font-weight: 800;">Source changée automatiquement</span>
        <span style="font-size: 19px; color: rgba(235,235,245,0.72);">Même version : 4K · FR — aucune action requise</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.07); font-size: 18px;">
      <span style="display: flex; align-items: center; gap: 8px; color: rgba(235,235,245,0.7);"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF9F0A;"></span>Source A · erreur de flux</span>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: rgba(235,235,245,0.7); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      <span style="display: flex; align-items: center; gap: 8px; font-weight: 700;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #30D158;"></span>Source B</span>
    </div>
    <span style="font-size: 17px; color: rgba(235,235,245,0.6);">La source A sera réessayée à la prochaine lecture.</span>
    <div style="position: absolute; left: 0; bottom: 0; height: 4px; width: 62%; background: rgba(245,245,247,0.6);"></div>
  </div>
</div>
