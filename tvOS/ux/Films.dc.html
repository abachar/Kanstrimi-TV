<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Films</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#08080C;color:#F5F5F7;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Figtree",sans-serif;-webkit-font-smoothing:antialiased}
.glass{background:rgba(255,255,255,0.10);backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22),0 18px 50px rgba(0,0,0,0.35)}
.chip{height:50px;padding:0 22px;border-radius:25px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.07);color:rgba(245,245,247,0.85);font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.chip-on{background:rgba(245,245,247,0.92);color:#0B0B0F;border-color:transparent;font-weight:700}
.mini{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:5px;border:1.5px solid rgba(255,255,255,0.55);font-size:13px;font-weight:700;letter-spacing:0.05em}
button{font-family:inherit;cursor:pointer}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(80% 60% at 50% 0%, #1B1822 0%, #08080C 70%);">
  <nav class="glass" aria-label="Onglets" style="position: absolute; left: 50%; top: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 40px;">
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Accueil</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Direct</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: rgba(255,255,255,0.24); color: #F5F5F7; font-size: 24px; font-weight: 700;">Films</button>
    <button style="border: none; padding: 12px 30px; border-radius: 32px; background: transparent; color: rgba(245,245,247,0.78); font-size: 24px; font-weight: 600;">Séries</button>
    <button aria-label="Rechercher" style="border: none; width: 56px; height: 52px; border-radius: 28px; background: transparent; color: rgba(245,245,247,0.78); display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
    </button>
  </nav>

  <div style="position: absolute; left: 80px; top: 150px; right: 80px; display: flex; align-items: baseline; justify-content: space-between;">
    <h1 style="margin: 0; font-size: 56px; font-weight: 800;">Films</h1>
    <span style="font-size: 20px; color: rgba(235,235,245,0.62);">Trier : Nouveautés</span>
  </div>

  <div style="position: absolute; left: 80px; top: 232px; display: flex; align-items: center; gap: 10px;">
    <button class="chip chip-on">Tous les genres
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button class="chip">Drame</button>
    <button class="chip">Thriller</button>
    <button class="chip">Comédie</button>
    <button class="chip">Animation</button>
    <span style="width: 1px; height: 34px; background: rgba(255,255,255,0.2); margin: 0 10px;"></span>
    <button class="chip">Langue : toutes
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button class="chip chip-on">4K</button>
    <button class="chip">Dolby Vision</button>
    <button class="chip">VF disponible</button>
  </div>

  <div style="position: absolute; left: 80px; top: 322px; width: 1760px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 40px; row-gap: 40px;">
    <sc-for list="{{films}}" as="f" hint-placeholder-count="12">
      <div style="display: flex; flex-direction: column; gap: 12px; transform: {{f.scale}}; transform-origin: center top;">
        <div style="position: relative; height: 390px; border-radius: 18px; overflow: hidden; background: {{f.art}}; box-shadow: {{f.shadow}};">
          <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.01em;">{{f.title}}</div>
          <sc-if value="{{f.warn}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; right: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: #F5B544; color: #1A1206; font-size: 13px; font-weight: 800; letter-spacing: 0.04em;">{{f.warn}}</span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; color: rgba(245,245,247,0.85);">
          <span class="mini">{{f.q}}</span>
          <span style="font-size: 16px; font-weight: 600; margin-left: 4px;">{{f.langs}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const art = (a, b) => 'radial-gradient(100% 80% at 50% 25%, ' + a + ' 0%, ' + b + ' 55%, #0A090C 100%)';
    const off = { scale: 'none', shadow: 'none', warn: '' };
    return {
      films: [
        { ...off, title: 'Les Heures Claires', q: '4K DV', langs: 'VF · VOSTFR · VO', art: art('#E0A565', '#6E3A22') },
        { ...off, title: 'Marée Basse', q: '4K DV', langs: 'VF · VOSTFR', art: art('#8FB59A', '#2A3F33'), scale: 'scale(1.08)', shadow: '0 30px 60px rgba(0,0,0,0.6), 0 0 0 3px rgba(245,245,247,0.9)' },
        { ...off, title: 'Minuit à Oran', q: '4K HDR', langs: 'VO · VOSTFR', art: art('#B0709F', '#3A2138') },
        { ...off, title: 'Le Dernier Quai', q: '4K', langs: 'VF', art: art('#7A8FC0', '#252C4A') },
        { ...off, title: 'Sel', q: '4K DV', langs: 'VF · VOSTFR', art: art('#D7C6A0', '#5B4A2E') },
        { ...off, title: 'Orbite Basse', q: '4K HDR', langs: 'VOSTFR', art: art('#6FA4C9', '#1C3448'), warn: 'VOSTFR SEUL' },
        { ...off, title: 'La Ville Haute', q: '4K', langs: 'VF · VO', art: art('#C77B5C', '#4A2419') },
        { ...off, title: 'Nuits Blanches', q: '4K DV', langs: 'VF · VOSTFR', art: art('#9A9AB8', '#2A2A40') },
        { ...off, title: 'Les Vents du Sud', q: '4K', langs: 'VF', art: art('#D9A04E', '#5A3814') },
        { ...off, title: 'Cartographe', q: '4K HDR', langs: 'VF · VOSTFR · VO', art: art('#79B39E', '#1F3A31') },
        { ...off, title: 'Anatomie du Silence', q: '4K DV', langs: 'VOSTFR · VO', art: art('#B78C8C', '#3E2626') },
        { ...off, title: 'Zone 9', q: '4K', langs: 'VF · VOSTFR', art: art('#8BA0AE', '#26313A'), warn: 'VF LE 12/10' }
      ]
    };
  }
}
</script>
</body>
</html>
